<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="史莱姆自走防线：操控英雄，部署四人史莱姆小队与凝胶炮塔，挑战关卡和无尽模式。" />
    <meta name="application-name" content="史莱姆自走防线" />
    <meta name="theme-color" content="#a7cf83" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="史莱姆自走防线" />
    <meta property="og:description" content="操控英雄，部署小队与炮塔，守住软胶核心。" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="史莱姆自走防线" />
    <meta name="twitter:description" content="操控英雄，部署小队与炮塔，守住软胶核心。" />
    <title>史莱姆自走防线</title>
    <link rel="preload" as="image" href="./assets/generated/survivor/survivor-moss-sprout.png?v=soft-gel-20260830-v9" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-label="史莱姆自走防线">
      <canvas id="game" width="720" height="1280" aria-label="史莱姆自走防线战场">
        当前浏览器不支持 Canvas。
      </canvas>
      <div id="rotateHint" role="status">
        <div class="rotate-card">
          <img
            class="rotate-slime"
            src="./assets/generated/survivor/survivor-moss-sprout.png?v=soft-gel-20260830-v9"
            width="512"
            height="512"
            alt=""
            aria-hidden="true"
            loading="eager"
            decoding="async"
          />
          <strong>请旋转为竖屏</strong>
          <span>竖屏体验更完整</span>
        </div>
      </div>
      <div id="loading" class="is-loading" role="status" aria-live="polite" aria-busy="true">
        <div class="loading-card">
          <div class="loading-mascot" aria-hidden="true">
            <span class="loading-orbit loading-orbit-a"></span>
            <span class="loading-orbit loading-orbit-b"></span>
            <img
              class="loading-blob"
              src="./assets/generated/survivor/survivor-moss-sprout.png?v=soft-gel-20260830-v9"
              width="512"
              height="512"
              alt=""
              aria-hidden="true"
              loading="eager"
              decoding="async"
              fetchpriority="high"
            />
          </div>
          <strong data-loading-title>准备中</strong>
          <span class="loading-status" data-loading-status>素材 0/0</span>
          <div
            class="loading-progress"
            data-loading-progress
            role="progressbar"
            aria-label="正式素材加载进度"
            aria-valuemin="0"
            aria-valuemax="0"
            aria-valuenow="0"
          >
            <span data-loading-progress-fill></span>
          </div>
          <button class="loading-retry" data-loading-retry type="button" hidden disabled>
            重试
          </button>
        </div>
      </div>
      <noscript>
        <div class="no-script">请启用 JavaScript。</div>
      </noscript>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
