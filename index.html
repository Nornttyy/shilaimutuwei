<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="史莱姆基地是一款持续白昼的横屏经营与三人远征游戏。史莱姆自动采集、建造和战斗，由玩家选择基地发展、远征路线与战后变异。" />
    <meta name="application-name" content="史莱姆基地" />
    <meta name="theme-color" content="#a7cf83" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="史莱姆基地 · 经营与三人远征" />
    <meta property="og:description" content="经营持续白昼的无限生态基地，采集材料、自由铺地建造，并派三只史莱姆自动战斗与探索。" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="史莱姆基地 · 经营与三人远征" />
    <meta name="twitter:description" content="经营持续白昼的无限生态基地，采集材料、自由铺地建造，并派三只史莱姆自动战斗与探索。" />
    <title>史莱姆基地 · 经营与三人远征</title>
    <link rel="preload" as="image" href="./assets/generated/survivor/survivor-moss-sprout.png?v=soft-gel-20260829-v1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-label="史莱姆基地游戏试玩版">
      <canvas id="game" width="1280" height="720" aria-label="无限史莱姆基地经营与三人远征地图">
        当前浏览器不支持 Canvas，无法运行史莱姆基地。
      </canvas>
      <div id="rotateHint" role="status">
        <div class="rotate-card">
          <img
            class="rotate-slime"
            src="./assets/generated/survivor/survivor-moss-sprout.png?v=soft-gel-20260829-v1"
            width="512"
            height="512"
            alt=""
            aria-hidden="true"
            loading="eager"
            decoding="async"
          />
          <strong>把设备横过来吧</strong>
          <span>史莱姆们需要更宽的战场</span>
        </div>
      </div>
      <div id="loading" class="is-loading" role="status" aria-live="polite" aria-busy="true">
        <div class="loading-card">
          <div class="loading-mascot" aria-hidden="true">
            <span class="loading-orbit loading-orbit-a"></span>
            <span class="loading-orbit loading-orbit-b"></span>
            <img
              class="loading-blob"
              src="./assets/generated/survivor/survivor-moss-sprout.png?v=soft-gel-20260829-v1"
              width="512"
              height="512"
              alt=""
              aria-hidden="true"
              loading="eager"
              decoding="async"
              fetchpriority="high"
            />
          </div>
          <strong data-loading-title>正在唤醒史莱姆基地</strong>
          <span class="loading-status" data-loading-status>正在装载正式素材 0/0</span>
          <div
            class="loading-progress"
            data-loading-progress
            role="progressbar"
            aria-label="正式素材加载进度"
            aria-valuemin="0"
            aria-valuemax="0"
            aria-valuenow="0"
          >
            <span data-loading-progress-fill></span>
          </div>
          <button class="loading-retry" data-loading-retry type="button" hidden disabled>
            重新加载正式素材
          </button>
        </div>
      </div>
      <noscript>
        <div class="no-script">史莱姆基地需要启用 JavaScript 才能运行。</div>
      </noscript>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
